<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Chatbot WebSocket Simple</title>
</head>
<body>
  <h1>Chatbot Temps Réel (WebSocket)</h1>
  <div id="messages"></div>
  <input id="input" type="text" placeholder="Écris un message..." autofocus />
  <button onclick="sendMessage()">Envoyer</button>

  <script>
    const ws = new WebSocket('ws://localhost:8080');

    ws.onopen = () => {
      console.log('✅ Connecté au serveur WebSocket');
    };

    ws.onmessage = (event) => {
      const messagesDiv = document.getElementById('messages');
      messagesDiv.innerHTML += `<p>${event.data}</p>`;
    };

    function sendMessage() {
      const input = document.getElementById('input');
      ws.send(input.value);
      input.value = '';
    }
  </script>
</body>
</html>
